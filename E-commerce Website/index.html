<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>ShopEasy</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<section class="products">

```
<div class="product">
    <img src="https://images.unsplash.com/photo-1512499617640-c2f999098c01" alt="Headphones">
    <h2>Wireless Headphones</h2>
    <p>$20</p>
    <button onclick="addToCart('Wireless Headphones')">Add to Cart</button>
</div>

<div class="product">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Smartphone">
    <h2>Smartphone</h2>
    <p>$35</p>
    <button onclick="addToCart('Smartphone')">Add to Cart</button>
</div>

<div class="product">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Watch">
    <h2>Smart Watch</h2>
    <p>$50</p>
    <button onclick="addToCart('Smart Watch')">Add to Cart</button>
</div>
```

</section>

<!-- Cart List -->

<section class="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
</section>

<script src="script.js"></script>

</body>
</html>
